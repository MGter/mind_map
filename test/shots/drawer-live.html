<!doctype html><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0d0f13; color: #cfd6e3; font: 13px/1.5 system-ui, sans-serif; }
  #root { padding: 24px; }
/* All colors come from the shell's --dsw-alias-* semantic tokens (ui-theme
 * design-platform.tm_css), so light/dark follow the app theme automatically. */

.tm_toggleButton {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  cursor: pointer;
}

.tm_toggleButton:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.tm_toggleButtonActive {
  background: var(--dsw-alias-interactive-bg-active);
  color: var(--dsw-alias-brand-primary);
}

/* Sidebar expanded: a labeled row matching the Settings trigger's footprint. */
.tm_toggleRow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  cursor: pointer;
  text-align: left;
}

.tm_toggleRow:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.tm_toggleLabel {
  white-space: nowrap;
}

.tm_toggleIcon {
  width: 18px;
  height: 18px;
  flex: none;
}

/* The map is a `main` panel: an ordinary centre-column page, so it fills the
 * column it is given instead of covering the frame. */
.tm_panel {
  height: 100%;
  min-height: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
}

.tm_header {
  display: flex;
  align-items: center;
  gap: 10px;
  /* No frame-overlay inset here: this is a panel inside the column, not a layer
   * under the floating title bar — that offset only left a dead band on top. */
  padding: 10px 14px;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
  background: var(--dsw-alias-bg-layer-1);
  flex: none;
}

/* Leftmost header control: leave the map and go back to the conversation. */
.tm_backButton {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 38px;
  padding: 0 18px 0 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 999px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(14px + var(--tm-font-step, 0px));
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}

.tm_backButton:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

/* ---- global search (header) --------------------------------------------- */
.tm_globalSearch {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
}

.tm_globalSearchInput {
  width: 200px;
  font: inherit;
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-2, rgba(255, 255, 255, 0.06));
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  padding: 5px 9px;
  outline: none;
}

.tm_globalSearchInput:focus {
  border-color: var(--dsw-alias-border-l3, rgba(255, 255, 255, 0.3));
}

.tm_globalSearchButton {
  font: inherit;
  font-size: calc(11.5px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
}

.tm_globalSearchButton:hover {
  color: var(--dsw-alias-label-primary);
}

.tm_globalSearchBackdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 9vh;
}

.tm_globalSearchPanel {
  width: min(980px, 92vw);
  max-height: 76vh;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}

.tm_globalSearchHead {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--dsw-alias-border-l2);
}

.tm_globalSearchTitle {
  font-size: calc(13px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}

.tm_globalSearchBody {
  padding: 0 16px 14px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Invisible node used to notice scrolling inside a results list. */
/* Inline shimmer while a conversation's other hits are still loading. */
.tm_searchInlineLoading {
  display: flex;
  align-items: center;
  padding: 4px 0 2px 10px;
}

.tm_searchInlineLoading > span {
  width: 62%;
}

.tm_drawerScrollSensor {
  width: 100%;
  height: 1px;
  opacity: 0;
}

/* ---- text size controls -------------------------------------------------- */
.tm_fontGroup {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-right: 6px;
}

.tm_fontButton {
  /* Both buttons must be the same box with the text optically centred: the
   * A and the sign are two spans of different sizes, so centre them as a pair
   * (baseline alignment made the two buttons sit at different heights). */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 46px;
  height: 28px;
  padding: 0 8px;
  line-height: 1;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font: inherit;
  font-size: calc(12px + var(--tm-font-step, 0px));
  cursor: pointer;
}

.tm_fontButton:hover:not(:disabled) {
  color: var(--dsw-alias-label-primary);
  border-color: var(--dsw-alias-border-l3, rgba(255, 255, 255, 0.3));
}

.tm_fontButton:disabled {
  opacity: 0.4;
  cursor: default;
}

.tm_fontGlyphSmall,
.tm_fontGlyphLarge {
  display: inline-block;
  /* Same advance width for both, so the two buttons are symmetric. */
  width: calc(9px + 0px);
  text-align: center;
  line-height: 1;
}

/* Both glyphs the same size: the − / + sign alone tells the two buttons apart,
 * so the pair reads as one control instead of two mismatched ones. */
.tm_fontGlyphSmall,
.tm_fontGlyphLarge {
  font-size: calc(13px + var(--tm-font-step, 0px));
}

.tm_fontSign {
  display: inline-block;
  font-size: calc(10px + var(--tm-font-step, 0px));
  line-height: 1;
  /* Reads as a superscript rather than a trailing character. */
  transform: translateY(-3px);
}

.tm_fontReset {
  min-width: 50px;
}

.tm_fontReset {
  min-width: 44px;
}

.tm_headerSpace {
  flex: 1;
}

/* Same pill as the hotkey button; min-width keeps the header from jumping
   as the label cycles 自动 / 中文 / English. */
.tm_langButton {
  flex: none;
  min-width: 72px;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 999px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  cursor: pointer;
  white-space: nowrap;
}

.tm_langButton:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

/* Right corner: the same "leave the map" action as the back button. */
.tm_closeButton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 999px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  cursor: pointer;
}

.tm_closeButton:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.tm_zoomResetLabel {
  font-size: calc(9px + var(--tm-font-step, 0px));
  font-weight: 700;
  letter-spacing: -0.5px;
}

.tm_canvas {
  flex: 1;
  min-height: 0;
  position: relative;
}

/* Slot layout: a card that gets pushed aside or fills a gap glides to its new
 * slot. The card under the pointer is exempt — it has to track the drag 1:1. */
/* ---- edges: 两种样子 ------------------------------------------------
   未同步 = 灰白静态虚线；同步中 = 灰白静态实线 + 一枚软光点沿曲线跑过去。
   线体和光点都由 MindMapEdge 组件画（光点是 animateMotion 跟随路径的径向
   渐变圆），样式表在这里只保留一个兜底：动效受限时让光点停住但仍在。 */
@media (prefers-reduced-motion: reduce) {
  .tm_canvas .tm_react-flow__edge circle {
    opacity: 0.28;
  }
}
.tm_canvas .tm_react-flow__node {
  transition: transform 200ms cubic-bezier(0.2, 0.8, 0.25, 1);
}

.tm_canvas .tm_react-flow__node.tm_dragging,
.tm_canvas .tm_react-flow__node.tm_tmDragging {
  transition: none;
}

/* React Flow draws a huge translucent bounding rect over the whole selected
 * set after a rubber-band select; spanning distant cards it covers half the
 * board, LOOKS like select-all, and swallows every click underneath. Kill
 * it — dragging any selected card still moves the whole selection. */
.tm_canvas .tm_react-flow__nodesselection,
.tm_canvas .tm_react-flow__nodesselection-rect {
  display: none !important;
  pointer-events: none !important;
}

.tm_card {
  position: relative;
  width: 224px;
  min-height: 104px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 10px;
  background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary);
  box-shadow: 0 1px 3px var(--dsw-alias-bg-mask-1);
  font-size: calc(13px + var(--tm-font-step, 0px));
}

.tm_cardSelected {
  border-color: var(--dsw-alias-brand-primary);
}

.tm_cardGhost {
  opacity: 0.55;
  border-style: dashed;
}

.tm_cardTop {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.tm_cardTitle {
  font-weight: 600;
  font-size: calc(13px + var(--tm-font-step, 0px));
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.tm_runningDot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ffffff;
  animation: tm_mindmap-pulse 1.6s ease-in-out infinite;
}

@keyframes tm_mindmap-pulse {
  50% { opacity: 0.35; }
}

.tm_cardNext {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
  min-width: 0;
}

.tm_cardNextLabel {
  flex: none;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-brand-primary);
  font-weight: 600;
}

.tm_cardNextText {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tm_cardStale {
  flex: none;
  color: var(--dsw-alias-state-warn-primary);
  font-size: calc(12px + var(--tm-font-step, 0px));
}

/* pinned footer: time always bottom-left, status badge bottom-right */
.tm_cardFooter {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_cardTime {
  flex: none;
}

/* Status chip: text and colour follow the lamp exactly — running = white,
 * waiting = amber, done = green, error = red. The white running dot lives in
 * the running chip only. */
.tm_cardChip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: calc(10px + var(--tm-font-step, 0px));
  font-weight: 600;
  white-space: nowrap;
  border: 1px solid transparent;
}

.tm_cardChipRunning {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.35);
}

.tm_cardChipWaiting {
  color: rgb(245, 178, 46);
  background: rgba(245, 178, 46, 0.14);
  border-color: rgba(245, 178, 46, 0.42);
}

.tm_cardChipDone {
  color: rgb(52, 199, 89);
  background: rgba(52, 199, 89, 0.14);
  border-color: rgba(52, 199, 89, 0.42);
}

.tm_cardChipError {
  color: rgb(242, 78, 78);
  background: rgba(242, 78, 78, 0.14);
  border-color: rgba(242, 78, 78, 0.45);
}

/* Unsent composer text: deliberately neutral grey — a note, not a state the
 * user has to react to. */
.tm_cardChipDraft {
  color: rgb(255, 197, 61);
  background: rgba(255, 197, 61, 0.18);
  border-color: rgba(255, 197, 61, 0.5);
}

/* A run cut off by closing the app: muted amber, no lamp — it is history, not
 * something still happening. */
.tm_cardChipInterrupted {
  color: rgb(214, 158, 92);
  background: rgba(214, 158, 92, 0.14);
  border-color: rgba(214, 158, 92, 0.42);
}

.tm_cardSummary {
  font-size: calc(12px + var(--tm-font-step, 0px));
  line-height: 1.45;
  color: var(--dsw-alias-label-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.tm_cardBadgeWaiting {
  padding: 1px 7px;
  border-radius: 999px;
  font-size: calc(10px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-state-warn-label);
  background: var(--dsw-alias-state-warn-tertiary);
}

.tm_cardBadgeDone {
  padding: 1px 7px;
  border-radius: 999px;
  font-size: calc(10px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-state-success-primary);
  background: var(--dsw-alias-state-success-tertiary);
}

/* ---- the lamp ------------------------------------------------------------
 * running  = a faint, STEADY white halo + a highlight travelling around the
 *            card's border (a loading sweep, not a pulse — the card is busy,
 *            not asking for attention)
 * waiting  = amber breathing   · error = red breathing   · done = green breathing
 * The breathing lights are the ones that want the user to look.
 */
.tm_cardLampRunning {
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.34),
    0 0 16px 2px rgba(255, 255, 255, 0.2),
    0 0 40px 9px rgba(255, 255, 255, 0.1);
}

/* ---- rename dialog ------------------------------------------------------ */
/* ---- 查看摘要：read-only view of what a card would push --------------- */
.tm_dialogBackdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(2px);
  animation: tm_tmFadeIn 140ms ease-out;
}

.tm_digestDialog {
  width: min(720px, 86vw);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 18px 14px;
  border-radius: 14px;
  background: var(--dsw-alias-bg-elevated, #232323);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  animation: tm_tmRiseIn 200ms cubic-bezier(0.16, 1, 0.3, 1);
}

.tm_digestDialogHead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.tm_digestDialogTitle {
  font-size: calc(13px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}

.tm_digestDialogFrom {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
}

.tm_digestLabel {
  margin-top: 4px;
  font-size: calc(10.5px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary, rgba(255, 255, 255, 0.5));
}

.tm_digestText {
  width: 100%;
  min-height: 96px;
  max-height: 30vh;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  color: var(--dsw-alias-label-primary);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: calc(11.5px + var(--tm-font-step, 0px));
  line-height: 1.62;
  resize: none;
}

.tm_digestEmpty {
  padding: 18px 4px;
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
}

.tm_digestActions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}

.tm_renameBackdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0, 0, 0, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 22vh;
}

.tm_renameDialog {
  width: min(420px, 90vw);
  background: var(--dsw-alias-bg-layer-1);
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 12px;
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
  padding: 16px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tm_renameHeading {
  font-size: calc(13px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}

.tm_renameInput {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  font-size: calc(13px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-2, rgba(255, 255, 255, 0.06));
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  padding: 8px 10px;
  outline: none;
}

.tm_renameInput:focus {
  border-color: var(--dsw-alias-border-l3, rgba(255, 255, 255, 0.35));
}

.tm_renameError {
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: rgb(242, 78, 78);
}

.tm_renameActions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.tm_renameButton {
  font: inherit;
  font-size: calc(12.5px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}

.tm_renameButton:hover {
  color: var(--dsw-alias-label-primary);
}

.tm_renamePrimary {
  color: #0b0b0c;
  background: rgb(255, 214, 106);
  border-color: rgb(255, 214, 106);
}

.tm_renamePrimary:disabled {
  opacity: 0.5;
  cursor: default;
}

/* Pinned in the sidebar: a small mark before the title, lit so it reads at a
 * glance. The card keeps its full strength (pinning is a deliberate choice, not
 * something to fade out). */
.tm_cardPin {
  display: inline-flex;
  align-items: center;
  flex: none;
  color: rgb(255, 214, 106);
  filter: drop-shadow(0 0 5px rgba(255, 214, 106, 0.85));
  animation: tm_mindmap-pin-glow 2.6s ease-in-out infinite;
}

@keyframes tm_mindmap-pin-glow {
  0%, 100% {
    filter: drop-shadow(0 0 4px rgba(255, 214, 106, 0.6));
    opacity: 0.92;
  }
  50% {
    filter: drop-shadow(0 0 9px rgba(255, 214, 106, 1));
    opacity: 1;
  }
}

/* The conversation you came from: corner brackets, not a full frame. */
.tm_cardReticle {
  position: absolute;
  inset: -5px;
  pointer-events: none;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.45));
}

.tm_cardReticle i {
  position: absolute;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255, 255, 255, 0.9);
}

.tm_cardReticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 4px; }
.tm_cardReticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 4px; }
.tm_cardReticle i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 4px; }
.tm_cardReticle i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 4px; }

/* Nothing to report? The card recedes until you point at it. */
.tm_cardQuiet {
  opacity: 0.62;
  transition: opacity 140ms ease;
}

.tm_cardQuiet:hover {
  opacity: 1;
}

/* The stack cell dims like any idle card; a tinted count still says "something
 * in here has news" without lighting the whole cell up. */
.tm_stackBadgeBusy {
  color: rgb(255, 197, 61);
  border-color: rgba(255, 197, 61, 0.5);
}

/* The travelling highlight: a conic gradient masked down to a 2px ring. The
 * RING stays put — only the gradient's start angle is animated (registered
 * custom property), which is what makes it read as light flowing around the
 * card instead of a box spinning. */
@property --tm-ring-angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

.tm_cardLampRunning::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 12px;
  padding: 2px;
  background: conic-gradient(
    from var(--tm-ring-angle),
    rgba(255, 255, 255, 0) 0deg,
    rgba(255, 255, 255, 0) 190deg,
    rgba(255, 255, 255, 0.18) 250deg,
    rgba(255, 255, 255, 0.55) 292deg,
    rgba(255, 255, 255, 1) 325deg,
    rgba(255, 255, 255, 0.4) 352deg,
    rgba(255, 255, 255, 0) 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: tm_mindmap-ring-sweep 1.8s linear infinite;
  pointer-events: none;
}

@keyframes tm_mindmap-ring-sweep {
  to { --tm-ring-angle: 360deg; }
}

.tm_cardLampDone {
  animation: tm_mindmap-lamp-green 2.8s ease-in-out infinite;
}

.tm_cardLampError {
  animation: tm_mindmap-lamp-red 1.9s ease-in-out infinite;
}

.tm_cardLampWaiting {
  animation: tm_mindmap-lamp-amber 3.4s ease-in-out infinite;
}

@keyframes tm_mindmap-lamp-green {
  0%, 100% {
    box-shadow:
      inset 0 0 0 1px rgba(52, 199, 89, 0.40),
      0 0 14px 1px rgba(52, 199, 89, 0.26),
      0 0 34px 8px rgba(52, 199, 89, 0.11);
  }
  50% {
    box-shadow:
      inset 0 0 0 1px rgba(52, 199, 89, 0.72),
      0 0 24px 5px rgba(52, 199, 89, 0.46),
      0 0 62px 20px rgba(52, 199, 89, 0.22);
  }
}

@keyframes tm_mindmap-lamp-amber {
  0%, 100% {
    box-shadow:
      inset 0 0 0 1px rgba(245, 178, 46, 0.42),
      0 0 14px 1px rgba(245, 178, 46, 0.24),
      0 0 34px 8px rgba(245, 178, 46, 0.11);
  }
  50% {
    box-shadow:
      inset 0 0 0 1px rgba(245, 178, 46, 0.72),
      0 0 24px 5px rgba(245, 178, 46, 0.44),
      0 0 60px 19px rgba(245, 178, 46, 0.20);
  }
}

@keyframes tm_mindmap-lamp-red {
  0%, 100% {
    box-shadow:
      inset 0 0 0 1px rgba(242, 78, 78, 0.46),
      0 0 14px 1px rgba(242, 78, 78, 0.28),
      0 0 34px 8px rgba(242, 78, 78, 0.12);
  }
  50% {
    box-shadow:
      inset 0 0 0 1px rgba(242, 78, 78, 0.80),
      0 0 26px 6px rgba(242, 78, 78, 0.52),
      0 0 66px 22px rgba(242, 78, 78, 0.26);
  }
}

.tm_cardRemove {
  align-self: flex-start;
  padding: 3px 8px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 6px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(12px + var(--tm-font-step, 0px));
  cursor: pointer;
}

.tm_cardRemove:hover {
  background: var(--dsw-alias-interactive-bg-hover-danger);
  color: var(--dsw-alias-state-error-primary);
}

/* Connection points: fully invisible at rest (still hit-testable — opacity
 * keeps pointer events), revealed on card hover or while a drag is live.
 * Deliberately NOT transitioned: a transition rides the animation clock,
 * which throttled/background tabs freeze — the handles would then stay
 * stuck invisible mid-drag. Instant toggle is timing-independent. */
.tm_cardHandle {
  width: 10px;
  height: 10px;
  background: var(--dsw-alias-border-l3);
  border: 2px solid var(--dsw-alias-bg-layer-1);
  opacity: 0;
}

.tm_card:hover .tm_cardHandle,
.tm_canvasConnecting .tm_cardHandle {
  opacity: 1;
}

.tm_cardHandle:hover {
  background: var(--dsw-alias-brand-primary);
}

.tm_cardRefresh {
  flex: none;
  margin-left: auto;
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--dsw-alias-label-tertiary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity 120ms ease;
}

.tm_card:hover .tm_cardRefresh {
  opacity: 1;
}

.tm_cardRefresh:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.tm_cardRefreshBusy {
  opacity: 1;
  animation: tm_mindmap-spin 1s linear infinite;
}

@keyframes tm_mindmap-spin {
  to { transform: rotate(360deg); }
}

.tm_spawnPanel {
  position: absolute;
  right: 24px;
  top: 24px;
  z-index: 6;
  width: 420px;
  max-width: calc(100% - 48px);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 12px;
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 8px 30px var(--dsw-alias-bg-mask-2);
}

.tm_spawnHeading {
  font-size: calc(14px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}

.tm_spawnFrom {
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-secondary);
}

.tm_spawnModes {
  display: flex;
  gap: 6px;
}

.tm_spawnModeBtn {
  flex: 1;
  padding: 5px 0;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(12px + var(--tm-font-step, 0px));
  cursor: pointer;
}

.tm_spawnModeBtn:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}

.tm_spawnModeActive {
  border-color: var(--dsw-alias-brand-primary);
  color: var(--dsw-alias-brand-primary);
  background: var(--dsw-alias-interactive-bg-active);
}

.tm_spawnHint {
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_spawnTextarea {
  width: 100%;
  resize: vertical;
  min-height: 140px;
  padding: 10px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  line-height: 1.5;
  font-family: inherit;
}

.tm_spawnError {
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-state-error-primary);
  word-break: break-all;
}

.tm_spawnActions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.tm_spawnBtnPrimary {
  padding: 6px 16px;
  border: none;
  border-radius: 8px;
  background: var(--dsw-alias-button-primary-fill);
  color: var(--dsw-alias-label-primary-foreground);
  font-size: calc(13px + var(--tm-font-step, 0px));
  cursor: pointer;
}

.tm_spawnBtnPrimary:hover {
  background: var(--dsw-alias-button-primary-hover);
}

.tm_spawnBtnPrimary:disabled {
  background: var(--dsw-alias-button-primary-dimmed);
  cursor: default;
}

.tm_spawnBtnGhost {
  padding: 6px 16px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  cursor: pointer;
}

.tm_spawnBtnGhost:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}

.tm_wsFrame {
  position: relative;
  border: 1.5px dashed var(--dsw-alias-border-l2);
  border-radius: 16px;
  background: transparent;
}

/* Mid-drag over a neighbour: the drop will bounce, so say so before release. */
.tm_wsFrameBlocked {
  border-color: rgb(242, 78, 78) !important;
  box-shadow: 0 0 0 1px rgba(242, 78, 78, 0.45) inset;
}

.tm_wsFrameSelected {
  border-style: solid;
  border-color: var(--dsw-alias-brand-primary);
}

.tm_wsFrameLabel {
  position: absolute;
  top: -12px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--dsw-alias-border-l1);
  background: var(--dsw-alias-bg-layer-1);
  font-size: calc(12px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-secondary);
  white-space: nowrap;
  /* the frame body is click-through; the chip is the physical handle */
  pointer-events: auto;
  cursor: grab;
  /* Above the resize strips: the title bar is the folder's primary drag
   * surface, so it has to win wherever it overlaps the top-edge handle. */
  z-index: 5;
}

.tm_wsFrameLabel:active {
  cursor: grabbing;
}

/* invisible strips along the dashed edge: click to select, drag to move */
.tm_wsFrameEdge {
  position: absolute;
  pointer-events: auto;
  cursor: grab;
}

.tm_wsFrameEdge:active {
  cursor: grabbing;
}

/* Resize handles: the folder's own edges, like a desktop folder. The east and
 * south strips sit on the border, the corner keeps the classic diagonal. */

.tm_wsFrameCount {
  font-weight: 400;
  color: var(--dsw-alias-label-tertiary);
}

/* Mode picker (标准模式 / 创造模式) — the same choice the shell's own new-task
 * composer offers, kept as two chips so it reads at a glance. */

.tm_menu {
  position: absolute;
  /* Above the stack drawer (30): a card menu opened from inside the drawer
   * has to float over it, not behind it. */
  z-index: 60;
  min-width: 200px;
  max-width: 280px;
  max-height: 380px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: 6px;
  border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 10px;
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 8px 30px var(--dsw-alias-bg-mask-2);
}

.tm_menuTitle {
  flex: none;
  padding: 4px 10px 6px;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_menuSearch {
  flex: none;
  box-sizing: border-box;
  width: calc(100% - 8px);
  margin: 2px 4px 6px;
  padding: 5px 8px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 7px;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font-size: calc(12px + var(--tm-font-step, 0px));
  font-family: inherit;
}

.tm_menuHint {
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-dimmed);
}

.tm_menuPreview {
  flex: none;
  padding: 0 10px 4px;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
  word-break: break-all;
}

.tm_menuError {
  flex: none;
  padding: 0 10px 4px;
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-state-error-primary);
  word-break: break-all;
}

.tm_menuEmpty {
  padding: 8px 10px;
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_menuItem {
  /* .tm_menu is a flex column with max-height: without flex:none a long list
   * SHRINKS every row and clips the text vertically */
  flex: none;
  /* Leading 14px glyph + label on one baseline. */
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 6px 10px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--dsw-alias-label-primary);
  font-size: calc(13px + var(--tm-font-step, 0px));
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tm_menuIcon {
  flex: none;
  width: 14px;
  height: 14px;
  color: var(--dsw-alias-label-secondary);
}

/* Destructive rows read red end to end: label plus glyph. */
.tm_menuItemDanger {
  color: rgb(242, 78, 78);
}

.tm_menuItemDanger .tm_menuIcon {
  color: rgb(242, 78, 78);
}

.tm_menuItem:hover:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover);
}

.tm_menuItem:disabled {
  color: var(--dsw-alias-label-dimmed);
  cursor: default;
}

.tm_wsFrameHidden {
  font-weight: 400;
  color: var(--dsw-alias-state-warn-primary);
}

.tm_emptyHint {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: calc(13px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
  pointer-events: none;
  z-index: 4;
}

.tm_toast {
  position: absolute;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  z-index: 8;
  max-width: 70%;
  padding: 7px 16px;
  border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 999px;
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 4px 16px var(--dsw-alias-bg-mask-2);
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-primary);
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- overflow stack cell ------------------------------------------------
 * When a folder is too small for its cards, the last visible slot becomes a
 * pile: two offset sheets behind a face that names the newest folded card and
 * counts the rest. Clicking it opens the drawer. */
.tm_stackCell {
  position: relative;
  width: 224px;
  height: 104px;
  cursor: pointer;
}

.tm_stackSheetBack,
.tm_stackSheetMid {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-1);
}

.tm_stackSheetBack {
  transform: translate(11px, 11px) scale(0.95);
  opacity: 0.35;
}

.tm_stackSheetMid {
  transform: translate(5px, 5px) scale(0.977);
  opacity: 0.6;
}

.tm_stackFace {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 12px;
  background: var(--dsw-alias-bg-layer-1);
  transition: border-color 140ms ease, transform 140ms ease;
}

.tm_stackCell:hover .tm_stackFace {
  border-color: var(--dsw-alias-brand-primary);
  transform: translateY(-1px);
}

.tm_stackFaceTitle {
  font-size: calc(13px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.tm_stackBadge {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--dsw-alias-border-l2);
  color: var(--dsw-alias-label-secondary);
  font-size: calc(11px + var(--tm-font-step, 0px));
  font-variant-numeric: tabular-nums;
}

/* ---- the drawer behind that cell ---------------------------------------- */
.tm_drawerBackdrop {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dsw-alias-bg-mask-2);
}

.tm_drawer {
  /* Wide enough for several columns: the drawer is a browser, not a list. */
  width: min(1120px, 94%);
  max-height: 84%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 16px;
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 18px 48px var(--dsw-alias-bg-mask-2);
  overflow: hidden;
}

.tm_drawerHead {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
  padding: 12px 14px;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
}

.tm_drawerTitle {
  font-size: calc(14px + var(--tm-font-step, 0px));
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}

.tm_drawerCount {
  font-size: calc(12px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_drawerSpace {
  flex: 1;
}

.tm_drawerHint {
  font-size: calc(11px + var(--tm-font-step, 0px));
  color: var(--dsw-alias-label-tertiary);
}

.tm_drawerClose {
  flex: none;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 999px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: calc(16px + var(--tm-font-step, 0px));
  line-height: 1;
  cursor: pointer;
}

.tm_drawerClose:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

/* Multi-column grid of 224px cards; one wheel notch = one row. */
/* Rows settle in one after another: 14ms apart, capped, so a long list still
 * feels immediate. */
.tm_drawerHits > .tm_drawerHit {
  animation: tm_tmPopIn 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.tm_drawerHits > .tm_drawerHit:nth-child(1) { animation-delay: 20ms; }
.tm_drawerHits > .tm_drawerHit:nth-child(2) { animation-delay: 34ms; }
.tm_drawerHits > .tm_drawerHit:nth-child(3) { animation-delay: 48ms; }
.tm_drawerHits > .tm_drawerHit:nth-child(4) { animation-delay: 62ms; }
.tm_drawerHits > .tm_drawerHit:nth-child(5) { animation-delay: 76ms; }
.tm_drawerHits > .tm_drawerHit:nth-child(n+6) { animation-delay: 90ms; }

/* ---- search loading ------------------------------------------------------ */
.tm_searchLoading {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px 0 2px;
}

.tm_searchLoadingBar {
  position: relative;
  height: 2px;
  border-radius: 2px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.07);
}

.tm_searchLoadingBar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 34%;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--dsw-alias-brand-primary), transparent);
  animation: tm_tmSlideBar 1150ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes tm_tmSlideBar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}

.tm_searchSkeletonRow {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 9px 10px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 9px;
}

.tm_searchSkeletonTitle,
.tm_searchSkeletonLine {
  display: block;
  height: 9px;
  border-radius: 4px;
  background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.12), rgba(255,255,255,0.05));
  background-size: 220% 100%;
  animation: tm_tmShimmer 1300ms ease-in-out infinite;
}

.tm_searchSkeletonTitle { width: 38%; }
.tm_searchSkeletonLine { width: 78%; }

@keyframes tm_tmShimmer {
  0% { background-position: 120% 0; }
  100% { background-position: -60% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .tm_drawerHits > .tm_drawerHit,
  .tm_searchLoadingBar > i,
  .tm_searchSkeletonTitle,
  .tm_searchSkeletonLine {
    animation: tm_none;
  }
}
/* ---- motion ---------------------------------------------------------------
 * One vocabulary for the whole map: short, eased, no bounce. Everything here is
 * optional decoration — every rule is disabled under prefers-reduced-motion.
 */
@keyframes tm_tmFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes tm_tmFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes tm_tmRiseIn {
  from { opacity: 0; transform: translateY(26px) scale(0.94); }
  60% { opacity: 1; }
  to { opacity: 1; transform: none; }
}

@keyframes tm_tmRiseOut {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(10px) scale(0.985); }
}

@keyframes tm_tmPopIn {
  from { opacity: 0; transform: translateY(6px) scale(0.97); }
  to { opacity: 1; transform: none; }
}

@keyframes tm_tmCardIn {
  from { opacity: 0; transform: translateY(6px) scale(0.99); }
  to { opacity: 1; transform: none; }
}

/* Drawer: fast, smooth, and it leaves the same way it arrived. */
.tm_drawerBackdrop {
  animation: tm_tmFadeIn 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.tm_drawerBackdropOut {
  animation: tm_tmFadeOut 130ms ease-in both;
}

.tm_drawer {
  /* Spring-ish: quick out of the gate, long soft settle, no bounce. */
  animation: tm_tmRiseIn 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
  will-change: transform, opacity;
}

.tm_drawerOut {
  animation: tm_tmRiseOut 150ms cubic-bezier(0.4, 0, 0.7, 0.2) both;
}

/* The global search panel shares the vocab. */
.tm_globalSearchBackdrop {
  animation: tm_tmFadeIn 130ms ease-out both;
}

.tm_globalSearchPanel {
  animation: tm_tmRiseIn 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
  will-change: transform, opacity;
}

/* Context menu pops from its corner. */
