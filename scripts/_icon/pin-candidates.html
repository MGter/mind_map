<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>置顶图标候选</title>
<style>
  html, body { margin: 0; background: #1b1b1d; color: #e8e8ea;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 22px 40px; }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #8b8b90; margin: 0 0 18px; }

  /* 容器照抄产品卡片：深底、13px 标题、13px 图标、暖金发光 */
  .trow { display: flex; align-items: center; gap: 20px; background: #202024;
    border: 1px solid #2e2e33; border-radius: 10px; padding: 13px 14px; margin: 0 0 10px; }
  .idx { width: 20px; font-size: 12px; color: #8b8b90; flex: none; }
  .card { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title { font-size: 13px; color: #e8e8ea; white-space: nowrap; }
  .pin { display: inline-flex; align-items: center; flex: none; color: rgb(255, 214, 106);
    filter: drop-shadow(0 0 5px rgba(255, 214, 106, 0.85)); }
  .pin svg { width: 13px; height: 13px; display: block; }
  .zoom svg { width: 52px; height: 52px; color: rgb(255, 214, 106); }
  .zoom { flex: none; }
  .lab { flex: none; width: 190px; font-size: 12px; color: #9a9aa0; line-height: 1.5; }
  .cur .idx { color: #d08a7a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>置顶图标 —— 候选</h1>
  <p class="sub">左边是 13px 真实尺寸（真卡片容器 + 真发光），右边 4× 放大。</p>

  <!-- A: 现行（圆头 + 收腰 + 针） -->
  <div class="trow cur">
    <div class="idx">A</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5c0 2 1.1 3.6 2.5 4.6l-.8 5.4a1.3 1.3 0 0 0 1.3 1.5h4a1.3 1.3 0 0 0 1.3-1.5l-.8-5.4C15.9 10.6 17 9 17 7a5 5 0 0 0-5-5Z"/><path fill="currentColor" d="M11 18h2v3.2a1 1 0 0 1-2 0Z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5c0 2 1.1 3.6 2.5 4.6l-.8 5.4a1.3 1.3 0 0 0 1.3 1.5h4a1.3 1.3 0 0 0 1.3-1.5l-.8-5.4C15.9 10.6 17 9 17 7a5 5 0 0 0-5-5Z"/><path fill="currentColor" d="M11 18h2v3.2a1 1 0 0 1-2 0Z"/></svg></div>
    <div class="lab">现行：圆头略细，13px 下看不出"钉"</div>
  </div>

  <!-- B: 横帽图钉（Windows / VS Code 那种） -->
  <div class="trow">
    <div class="idx">B</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.4 2.6h11.2v2.9H6.4z"/><path fill="currentColor" d="M8.9 5.5h6.2l1.3 6.9H7.6z"/><path fill="currentColor" d="M11.05 12.4h1.9v8.1a.95.95 0 0 1-1.9 0z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.4 2.6h11.2v2.9H6.4z"/><path fill="currentColor" d="M8.9 5.5h6.2l1.3 6.9H7.6z"/><path fill="currentColor" d="M11.05 12.4h1.9v8.1a.95.95 0 0 1-1.9 0z"/></svg></div>
    <div class="lab">横帽钉：帽子最显眼，13px 也认得出</div>
  </div>

  <!-- C: Keep 风格（圆头 + 粗短身，几乎没有针） -->
  <div class="trow">
    <div class="idx">C</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.8a5.4 5.4 0 0 0-5.4 5.4c0 2.2 1.3 3.9 2.9 4.9V17a2.5 2.5 0 0 0 5 0V12.1c1.6-1 2.9-2.7 2.9-4.9A5.4 5.4 0 0 0 12 1.8Z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.8a5.4 5.4 0 0 0-5.4 5.4c0 2.2 1.3 3.9 2.9 4.9V17a2.5 2.5 0 0 0 5 0V12.1c1.6-1 2.9-2.7 2.9-4.9A5.4 5.4 0 0 0 12 1.8Z"/></svg></div>
    <div class="lab">Keep 风：粗壮，但身体太长像温度计</div>
  </div>

  <!-- D: 横帽 + 短针收腰（B 的紧凑版） -->
  <div class="trow">
    <div class="idx">D</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.2 2.4h11.6v3H6.2z"/><path fill="currentColor" d="M8.3 5.4h7.4l.9 5.2H7.4z"/><path fill="currentColor" d="M10.9 10.6h2.2v9.6a1.1 1.1 0 0 1-2.2 0z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.2 2.4h11.6v3H6.2z"/><path fill="currentColor" d="M8.3 5.4h7.4l.9 5.2H7.4z"/><path fill="currentColor" d="M10.9 10.6h2.2v9.6a1.1 1.1 0 0 1-2.2 0z"/></svg></div>
    <div class="lab">横帽紧凑版：身短针长，重心更稳</div>
  </div>
</div>
</body>
</html>
