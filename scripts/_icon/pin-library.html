<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>置顶图标 —— 图标库原版</title>
<style>
  html, body { margin: 0; background: #1b1b1d; color: #e8e8ea;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 22px 40px; }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #8b8b90; margin: 0 0 18px; }
  .trow { display: flex; align-items: center; gap: 20px; background: #202024;
    border: 1px solid #2e2e33; border-radius: 10px; padding: 13px 14px; margin: 0 0 10px; }
  .idx { width: 20px; font-size: 12px; color: #8b8b90; flex: none; }
  .card { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title { font-size: 13px; color: #e8e8ea; white-space: nowrap; }
  .pin { display: inline-flex; align-items: center; flex: none; color: rgb(255, 214, 106);
    filter: drop-shadow(0 0 5px rgba(255, 214, 106, 0.85)); }
  .pin svg { width: 13px; height: 13px; display: block; }
  .zoom svg { width: 54px; height: 54px; color: rgb(255, 214, 106); }
  .zoom { flex: none; }
  .lab { flex: none; width: 200px; font-size: 12px; color: #9a9aa0; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>置顶图标 —— 直接用图标库原版</h1>
  <p class="sub">左边 13px 真实尺寸（真卡片容器 + 真发光），右边放大。</p>

  <!-- E: Lucide `pin`（描边版，2px 圆头） -->
  <div class="trow">
    <div class="idx">E</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
      </svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
    </svg></div>
    <div class="lab">Lucide <code>pin</code>：标准图钉（描边）</div>
  </div>

  <!-- F: Material Symbols `push_pin` 实心 -->
  <div class="trow">
    <div class="idx">F</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></div>
    <div class="lab">Material <code>push_pin</code> 实心：13px 最扎实</div>
  </div>

  <!-- G: Material 实心 + 加长针（小尺寸更清楚） -->
  <div class="trow">
    <div class="idx">G</div>
    <div class="card">
      <span class="pin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 8.6V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v4.6c0 1.66-1.34 3-3 3v2h5.1v7.9l.9 1 .9-1V13.6H19v-2c-1.66 0-3-1.34-3-3z"/></svg></span>
      <span class="title">思维图插件交互与布局改造</span>
    </div>
    <div class="zoom"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 8.6V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v4.6c0 1.66-1.34 3-3 3v2h5.1v7.9l.9 1 .9-1V13.6H19v-2c-1.66 0-3-1.34-3-3z"/></svg></div>
    <div class="lab">G：同一形状，针更长、头部更宽</div>
  </div>
</div>
</body>
</html>
